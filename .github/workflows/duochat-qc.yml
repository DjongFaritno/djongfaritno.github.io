name: DuoChat website QC
on:
  pull_request:
    paths: ['duochat/**', '.github/workflows/duochat-qc.yml']
  push:
    branches: [master]
    paths: ['duochat/**', '.github/workflows/duochat-qc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source and release selection
        run: |
          node --check duochat/app.js
          node --check duochat/releases.js
          node --check duochat/test/browser.cjs
          node --test duochat/test/releases.test.cjs
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/duochat-qc" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/duochat-qc/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify desktop and mobile interactions
        env:
          NODE_PATH: ${{ runner.temp }}/duochat-qc/node_modules
        run: node duochat/test/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duochat-website-previews
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
